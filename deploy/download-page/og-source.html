<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;src:url("assets/fonts/PlusJakartaSans_500Medium.ttf") format("truetype")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:700;src:url("assets/fonts/PlusJakartaSans_700Bold.ttf") format("truetype")}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 100%);color:#fff;
  display:flex;flex-direction:column;justify-content:center;padding:0 96px;position:relative}
body::after{content:"";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
img{width:340px;height:auto;display:block;margin-bottom:56px}
h1{font-size:76px;line-height:1.08;letter-spacing:-.02em;font-weight:700;max-width:880px}
p{margin-top:22px;font-size:30px;font-weight:500;color:rgba(255,255,255,.86)}
</style>
</head>
<body>
  <img src="assets/logo-dark.png" alt="">
  <h1>Never lose a warranty again.</h1>
  <p>Warranty tracker for Android</p>
</body>
</html>
