<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source of assets/og.jpg (1200x630, the link preview). Render it from this folder with headless Chrome:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=og.png og-source.html  (then save it as assets/og.jpg, quality about 85) -->
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;src:url("assets/fonts/plus-jakarta-sans-500.woff2") format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:800;src:url("assets/fonts/plus-jakarta-sans-800.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#fff;position:relative;
  background:radial-gradient(700px 500px at 85% 20%,#3B82F6 0,transparent 70%),linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#17324D 100%)}
body::before{content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px;
  -webkit-mask-image:radial-gradient(60% 80% at 20% 50%,#000,transparent 75%);mask-image:radial-gradient(60% 80% at 20% 50%,#000,transparent 75%)}
.copy{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.copy img{width:250px;height:auto;margin-bottom:44px}
h1{font-weight:800;font-size:72px;line-height:1.02;letter-spacing:-.035em}
h1 em{font-style:normal;color:#BFDBFE}
p{margin-top:24px;font-size:26px;font-weight:500;color:rgba(255,255,255,.85)}
.phone{position:absolute;right:96px;top:70px;width:300px;padding:10px;border-radius:44px;background:#0F172A;
  box-shadow:0 40px 80px -20px rgba(8,20,50,.6),0 0 0 1px rgba(255,255,255,.08) inset;transform:rotate(4deg)}
.phone img{display:block;width:100%;border-radius:35px}
</style>
</head>
<body>
  <div class="copy">
    <img src="assets/logo-dark.png" alt="">
    <h1>Never lose a <em>warranty</em> again.</h1>
    <p>Warranty tracker for Android · Free, no ads</p>
  </div>
  <div class="phone"><img src="assets/screens/en-home.webp" alt=""></div>
</body>
</html>
