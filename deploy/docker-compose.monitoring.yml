# Overlay with a small monitoring stack: Prometheus keeps 15 days of metrics from the server (node_exporter) and from the
# worker's /metrics, Grafana shows them. Turn it on in .env.prod (with the tunnel overlay):
#   COMPOSE_OVERLAY='docker-compose.tunnel.yml docker-compose.monitoring.yml'
#   GRAFANA_ADMIN_PASSWORD=...            # openssl rand -base64 24 (never commit it)
# then ./up.sh up -d and recreate Caddy. Grafana is published as monitor.<DOMAIN> (Caddyfile.tunnel port 8086) and
# must sit behind Cloudflare Access; Prometheus and node_exporter are never published. See HOME-SERVER.md section 10.
x-monitoring: &monitoring
  restart: unless-stopped
  logging:
    driver: journald
    options:
      tag: "{{.Name}}"

services:
  prometheus:
    <<: *monitoring
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 400m

  # Server metrics (CPU, memory, disk, load). It sees the host's /proc and /sys read-only; network graphs would show the
  # container's own interface, so they are left out of the dashboard.
  node-exporter:
    <<: *monitoring
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    mem_limit: 64m

  grafana:
    <<: *monitoring
    image: grafana/grafana-oss:12.1.1
    depends_on: [prometheus]
    environment:
      GF_SERVER_ROOT_URL: https://monitor.${DOMAIN}/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # nothing leaves the server: no usage reports, update checks or news feed
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m

volumes:
  prometheus-data:
  grafana-data:
