# Production stack for ONE server. Always run it through ./up.sh (it loads .env.prod and derives a few
# values), e.g.  ./up.sh up -d --build   |   ./up.sh ps   |   ./up.sh logs -f worker
#
# Only Caddy (ports 80 and 443) is reachable from the internet. Everything else lives on a private
# network. Keycloak's admin console is deliberately NOT public: reach it through an SSH tunnel
# (see README.md).
name: returnit-prod

x-restart: &restart
  restart: unless-stopped
  # Without a limit Docker keeps every log line forever and the disk eventually fills up.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  DATABASE_URL: postgres://returnit:${POSTGRES_PASSWORD}@postgres:5432/returnit?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-returnit-receipts}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  # Address of the signed receipt links, as the phone sees it (Caddy serves it, see Caddyfile).
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-files.${DOMAIN}}
  S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, keycloak]

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: returnit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: returnit
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnit -d returnit"]
      interval: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    # Job queue only: Postgres is the source of truth, so a short Redis outage loses no data.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20

  # Receipt files. Skip it by removing "minio" from COMPOSE_PROFILES and pointing S3_* at a hosted
  # S3-compatible service (Cloudflare R2, Backblaze B2, ...).
  minio:
    <<: *restart
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest # pin by digest once you settle on a version
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["minio-data:/data"]

  # Virus scanner (about 2 GB of RAM). Started only when MALWARE_SCAN=on in .env.prod (./up.sh handles the profile).
  clamav:
    <<: *restart
    profiles: ["scan"]
    image: clamav/clamav:1.4
    # First start downloads the virus signatures (a few minutes); then it reports healthy.
    volumes: ["clamav-db:/var/lib/clamav"]

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["../db/migrations:/migrations:ro"]
    command: ["-path=/migrations", "-database=postgres://returnit:${POSTGRES_PASSWORD}@postgres:5432/returnit?sslmode=disable", "up"]

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN}
      # Admin console only through an SSH tunnel to 127.0.0.1:8180 (never published to the internet).
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # internal callers (our API) get internal URLs
      KC_HTTP_ENABLED: "true" # TLS is terminated by Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      # Placeholders filled into the realm file at import time.
      KEYCLOAK_WORKER_SECRET: ${KEYCLOAK_WORKER_SECRET}
      MOBILE_REDIRECT_URI: ${MOBILE_REDIRECT_URI:-com.returnit.app:/oauth2redirect}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./keycloak/returnit-realm.prod.json:/opt/keycloak/data/import/returnit-realm.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # The image has no curl; talk HTTP through bash's /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  web:
    <<: *restart
    image: returnit:${APP_VERSION:-local}
    build: { context: .., dockerfile: Dockerfile }
    command: ["/web"]
    environment:
      <<: *app-env
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/returnit
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/returnit
      OIDC_AUDIENCE: returnit-api
      # Log JSON request and response bodies (personal data!). Keep "off" in production; "on" only for short debugging.
      LOG_REQUEST_BODY: ${LOG_REQUEST_BODY:-off}
      MALWARE_SCAN: ${MALWARE_SCAN:-on}
      CLAMAV_ADDR: clamav:3310
      # Caddy's address on the private network: only it may tell us the real client IP.
      TRUSTED_PROXIES: 172.30.0.0/24
    healthcheck:
      test: ["CMD", "/web", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy, required: false } # absent when MALWARE_SCAN=off
      keycloak: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *restart
    image: returnit:${APP_VERSION:-local}
    command: ["/worker"]
    environment:
      <<: *app-env
      SMTP_ADDR: ${SMTP_HOST:+${SMTP_HOST}:${SMTP_PORT:-587}}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: returnit
      KEYCLOAK_ADMIN_CLIENT_ID: returnit-worker
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_WORKER_SECRET}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_FILE: ${FCM_PROJECT_ID:+/run/secrets/fcm.json}
    volumes:
      # Mounted only when FCM_KEY_FILE is set (otherwise /dev/null, which the worker ignores).
      - ${FCM_KEY_FILE:-/dev/null}:/run/secrets/fcm.json:ro
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Catches all e-mail instead of sending it. For rehearsals only: COMPOSE_PROFILES=minio,rehearsal
  mailpit:
    profiles: ["rehearsal"]
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pg-data:
  redis-data:
  minio-data:
  clamav-db:
  caddy-data:
  caddy-config:
