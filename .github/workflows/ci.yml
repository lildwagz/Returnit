name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests: only the newest commit matters. main: never cancel a run that may be publishing or deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, vet, unit tests, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-ed:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  integration:
    name: Integration tests (Postgres, Redis, MinIO, ClamAV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: returnit
          POSTGRES_PASSWORD: returnit_dev
          POSTGRES_DB: returnit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U returnit" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
      clamav:
        image: clamav/clamav:1.4
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh" --health-interval 10s --health-timeout 5s --health-retries 60
    env:
      DATABASE_URL: postgres://returnit:returnit_dev@localhost:5432/returnit?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # MinIO needs a command, which service containers cannot pass, so start it by hand.
      # Official minio/minio images are no longer published; Chainguard builds MinIO from source.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=returnit -e MINIO_ROOT_PASSWORD=returnit_dev_secret \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      - name: Migrations apply, roll back and re-apply
        run: |
          migrate() { docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 -path=/migrations -database "$DATABASE_URL" "$@"; }
          migrate up
          migrate down -all
          migrate up

      - name: Wait for ClamAV (first start downloads virus signatures)
        run: |
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker ps -q --filter ancestor=clamav/clamav:1.4)")
            [ "$s" = healthy ] && exit 0
            sleep 10
          done
          echo "ClamAV not healthy"; exit 1

      - name: Integration tests
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_S3_ENDPOINT: localhost:9000
          TEST_S3_ACCESS_KEY: returnit
          TEST_S3_SECRET_KEY: returnit_dev_secret
          TEST_CLAMAV_ADDR: localhost:3310
          TEST_REDIS_ADDR: localhost:6379
        # -p 1: packages share one database.
        run: go test -tags integration -p 1 -count=1 ./internal/...

  image:
    name: Docker image builds and starts
    if: github.event_name == 'pull_request' # on main the publish job builds and tests the image it pushes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t returnit:ci .
      - name: Both programs are present and refuse to start without configuration
        run: bash scripts/ci-smoke-image.sh returnit:ci

  # Publishes the image that just passed every check, built once and smoke-tested before it is pushed.
  # Only for pushes to main, never for pull requests. Nothing is deployed from here yet.
  publish:
    name: Publish image to GHCR
    needs: [checks, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the only job that may write packages
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the full commit (what a deploy pins) and "latest". The action lowercases the repository name.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - name: Build once, load into the local Docker (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64 # the server is x86_64
          tags: returnit:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image that will be pushed
        run: bash scripts/ci-smoke-image.sh returnit:candidate
      - name: Tag, push and record the digest
        id: push
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag returnit:candidate "$tag"
            docker push "$tag" | tee -a push.log
          done <<'TAGS'
          ${{ steps.meta.outputs.tags }}
          TAGS
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | tail -1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE@$digest"
